services:
  api:
    build: .
    command: npm run dev
    volumes:
      - .:/app
    working_dir: /app
    env_file:
      - .env.docker
    depends_on:
      - redis
    ports:
      - "3000:3000"
 
  redis:
    image: redis:7
    ports:
    - "6379:6379" 

# port redis chỉ dùng khi chạy mỗi service redis, không cần thiết khi chạy cùng api